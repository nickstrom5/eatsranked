<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="@@CSP@@">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Eats Ranked</title>
<meta name="description" content="This page does not exist. Head back to Eats Ranked for restaurant apps, state by state.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FAF8F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151411" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--paper:#FAF8F3;--ink:#1A1814;--ink-2:#57534A;--rule:#E3DED3;--accent:#B8430F;
  --serif:ui-serif,"New York","Iowan Old Style",Charter,"Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--paper:#151411;--ink:#F3F0E8;--ink-2:#BDB7AA;--rule:#2C2924;--accent:#F07A45;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:17px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,56px)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
header.wrap{padding-top:26px}
.wordmark{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font:600 20px/1 var(--serif);letter-spacing:-.01em;color:var(--ink)}
.mk{display:inline-flex;align-items:flex-end;gap:3px;height:18px}
.mk i{display:block;width:5px;border-radius:1.5px;background:var(--ink)}
.mk i:nth-child(1){height:18px}.mk i:nth-child(2){height:12px}.mk i:nth-child(3){height:7px;background:var(--accent)}
main.wrap{flex:1;padding-top:clamp(72px,14vw,160px);padding-bottom:clamp(72px,14vw,160px)}
p.code{margin:0 0 18px;font:600 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
h1{font:500 clamp(40px,6.4vw,80px)/1.02 var(--serif);letter-spacing:-.025em;margin:0;max-width:14ch}
main p{color:var(--ink-2);max-width:40ch;margin:24px 0 0;font-size:clamp(17px,1.8vw,20px)}
.home{display:inline-flex;align-items:center;gap:8px;margin-top:34px;min-height:48px;padding:0 22px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:600;text-decoration:none}
footer{border-top:1px solid var(--rule);padding:28px 0 40px;font-size:14px;color:var(--ink-2)}
footer a{color:inherit;text-underline-offset:3px}
</style>
</head>
<body>
<header class="wrap">
  <a class="wordmark" href="/" aria-label="Eats Ranked, home"><span class="mk" aria-hidden="true"><i></i><i></i><i></i></span>Eats Ranked</a>
</header>
<main class="wrap">
  <p class="code">Page not found</p>
  <h1>This table isn&rsquo;t on the map.</h1>
  <p>The page you were looking for doesn&rsquo;t exist or has moved. Our restaurant apps are one click away.</p>
  <a class="home" href="/">Back to Eats Ranked <span aria-hidden="true">&rarr;</span></a>
</main>
<footer>
  <div class="wrap">Questions? <a href="mailto:@@EMAIL@@">@@EMAIL@@</a></div>
</footer>
</body>
</html>
